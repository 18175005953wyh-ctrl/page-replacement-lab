name: Page Replacement Lab tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Debug
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure with strict warnings
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSTRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure -V
